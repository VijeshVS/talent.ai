apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: talent-ai-data

resources:
  - postgres.yaml
  - mongodb.yaml
  - mongo-init-job.yaml
  - networkpolicy-mongodb-init.yaml
  - networkpolicy-mongodb-init-ingress.yaml
  - networkpolicy-grafana-postgres.yaml
  - redis.yaml
  - rabbitmq.yaml
  - qdrant.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: talent-ai
    includeSelectors: false
