apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local-only datastores. Phase 12 deliberately leaves talent-ai-data empty for
# staging/production (datastores are a Phase 13 concern). The local profile
# needs them in-cluster so the nine services can start without an external
# Compose stack. Data is emptyDir and therefore ephemeral.
namespace: talent-ai-data

resources:
  - postgres.yaml
  - mongodb.yaml
  - mongo-init-job.yaml
  - networkpolicy-mongodb-init.yaml
  - networkpolicy-mongodb-init-ingress.yaml
  - networkpolicy-grafana-postgres.yaml
  - redis.yaml
  - rabbitmq.yaml
  - qdrant.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: talent-ai
    includeSelectors: false
