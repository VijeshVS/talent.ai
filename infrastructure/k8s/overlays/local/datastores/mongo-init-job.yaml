# Initialises the single-node MongoDB replica set once mongod is reachable.
# Idempotent: rs.status() succeeds on subsequent runs and initiation is skipped.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7
          command: ['bash', '-c']
          args:
            - |
              MONGODB_DIRECT_URI='mongodb://mongodb-bootstrap:27017/?directConnection=true'
              until mongosh "$MONGODB_DIRECT_URI" --quiet --eval 'db.adminCommand("ping")' >/dev/null 2>&1; do
                echo "waiting for mongodb"
                sleep 2
              done
              mongosh "$MONGODB_DIRECT_URI" --quiet --eval '
                try {
                  rs.status();
                } catch (e) {
                  rs.initiate({
                    _id: "rs0",
                    members: [{
                      _id: 0,
                      host: "mongodb.talent-ai-data.svc.cluster.local:27017"
                    }]
                  });
                }
              '
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
