# Allows the one-shot replica-set initialiser to resolve the bootstrap Service
# and reach mongod. This namespace may already have default-deny policies on a
# repeated local start, so the required egress paths are explicit here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongodb-init
spec:
  podSelector:
    matchLabels:
      job-name: mongodb-init
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mongodb
      ports:
        - protocol: TCP
          port: 27017
