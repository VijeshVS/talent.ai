apiVersion: v1
kind: ConfigMap
metadata:
  name: talent-ai-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        platform: talent-ai
        env: local

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
            labels: { env: local }

      - job_name: talent-services
        metrics_path: /metrics
        static_configs:
          - targets: ['auth-service:5001']
            labels: { service: auth-service, env: local }
          - targets: ['talent-service:5002']
            labels: { service: talent-service, env: local }
          - targets: ['recruiter-service:5003']
            labels: { service: recruiter-service, env: local }
          - targets: ['engagement-service:5004']
            labels: { service: engagement-service, env: local }
          - targets: ['rewards-service:5005']
            labels: { service: rewards-service, env: local }
          - targets: ['ai-matching-service:5006']
            labels: { service: ai-matching-service, env: local }
          - targets: ['notification-service:5007']
            labels: { service: notification-service, env: local }
          - targets: ['analytics-service:5008']
            labels: { service: analytics-service, env: local }
          - targets: ['api-gateway:8080']
            labels: { service: api-gateway, env: local }

      - job_name: qdrant
        metrics_path: /metrics
        static_configs:
          - targets: ['qdrant.talent-ai-data.svc.cluster.local:6333']
            labels: { env: local }
