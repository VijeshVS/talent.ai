apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: grafana
          env:
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/talent-service-health.json
            - name: ANALYTICS_DB_HOST
              value: postgres.talent-ai-data.svc.cluster.local
            - name: ANALYTICS_DB_SSLMODE
              value: disable
