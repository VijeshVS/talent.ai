# Environment-specific resource requests/limits for production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: talent-ai
spec:
  template:
    spec:
      containers:
        - name: auth-service
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
