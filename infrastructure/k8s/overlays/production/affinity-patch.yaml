# Preferred per-service anti-affinity. The topology spread constraint is the
# enforced mechanism (DoNotSchedule); this preference adds a scheduling bias
# without making a rollout unschedulable on a small cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: talent-ai
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: api-gateway
