# Example secret management reference - NOT included in kustomization.
# Secrets must stay outside Git. Use External Secrets Operator, Sealed Secrets,
# or your cloud secret manager to materialize `talent-ai-secrets` in namespace
# `talent-ai` before deploying workloads.
#
# This file is a reference only. Do not add real secret values.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: talent-ai-secrets
  namespace: talent-ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: talent-ai-dev-secret-store
    kind: ClusterSecretStore
  target:
    name: talent-ai-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dev/talent-ai/app-secrets
