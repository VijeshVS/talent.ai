# Example secret management reference - NOT included in kustomization.
# Secrets must stay outside Git. Materialize `talent-ai-secrets` in namespace
# `talent-ai` via External Secrets Operator / Sealed Secrets / cloud secret manager.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: talent-ai-secrets
  namespace: talent-ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: talent-ai-staging-secret-store
    kind: ClusterSecretStore
  target:
    name: talent-ai-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: staging/talent-ai/app-secrets
