apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Platform layer. Workloads are generated from helm/talent-ai and committed as
# workloads.generated.yaml; the chart is the authored source.
resources:
  - namespaces
  - rbac
  - config
  - workloads
  - networking
  - policies

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: talent-ai
    includeSelectors: false
