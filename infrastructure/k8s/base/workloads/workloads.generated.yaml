        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: talent-ai
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '5002'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: talent-ai-talent-service
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: talent-service
      containers:
        - name: talent-service
          image: 'ghcr.io/vijeshvs/smart-match/talent-service:latest'
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5002
          envFrom:
            - configMapRef:
                name: talent-ai-config
            - secretRef:
                name: talent-ai-secrets
          env:
            - name: PORT
              value: '5002'
            - name: MONGODB_DB
              value: talent_profiles
            - name: TRUST_GATEWAY_HEADERS
              value: 'true'
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
