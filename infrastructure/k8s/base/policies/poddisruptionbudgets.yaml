# PDBs protect VOLUNTARY disruptions (drains, eviction API, node upgrades).
# They are NOT honoured during node-pressure eviction; PriorityClass governs
# that ordering instead. See docs/phase-12-kubernetes-platform.md §8.4.
#
# dev deletes these objects because most dev Deployments run one replica, where
# minAvailable: 1 would block every drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: talent-ai
  labels:
    app.kubernetes.io/part-of: talent-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
---
