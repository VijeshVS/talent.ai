# Phase 12 NetworkPolicies — concrete, directional, no unrestricted egress.
#
# Selector verification (see docs/phase-12-kubernetes-platform.md):
#   app.kubernetes.io/name       present on all nine Deployment pod templates
#   app.kubernetes.io/component  `backend` on eight services, `edge` on api-gateway
#   app.kubernetes.io/name: prometheus / grafana  present on the Phase 11 pods
#
# Namespace selectors use the automatic `kubernetes.io/metadata.name` label.
# No ipBlock is used anywhere. No 0.0.0.0/0 egress exists.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: talent-ai
  labels:
    app.kubernetes.io/part-of: talent-ai
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: talent-ai
  labels:
    app.kubernetes.io/part-of: talent-ai
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: talent-ai
  labels:
    app.kubernetes.io/part-of: talent-ai
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-gateway
  namespace: talent-ai
  labels:
    app.kubernetes.io/part-of: talent-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-notification
  namespace: talent-ai
  labels:
    app.kubernetes.io/part-of: talent-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5007
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-egress
  namespace: talent-ai
  labels:
    app.kubernetes.io/part-of: talent-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 5001
        - protocol: TCP
          port: 5002
        - protocol: TCP
          port: 5003
        - protocol: TCP
          port: 5004
        - protocol: TCP
          port: 5005
        - protocol: TCP
          port: 5006
        - protocol: TCP
          port: 5007
        - protocol: TCP
          port: 5008
---
