  namespace: talent-ai
  labels:
    app.kubernetes.io/part-of: talent-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-matching-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rewards-service
      ports:
        - protocol: TCP
          port: 5005
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ai-matching-to-rewards-ingress
  namespace: talent-ai
  labels:
    app.kubernetes.io/part-of: talent-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rewards-service
  policyTypes:
    - Ingress
  ingress:
