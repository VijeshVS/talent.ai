# One ServiceAccount per workload. None of the nine services calls the
# Kubernetes API, so every account has no RoleBinding and no automounted token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talent-ai-api-gateway
  namespace: talent-ai
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: talent-ai
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talent-ai-auth-service
  namespace: talent-ai
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: talent-ai
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talent-ai-talent-service
