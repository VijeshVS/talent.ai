# Single-node kind cluster for the local profile.
#
# The Phase 12 kind config uses one control-plane and two workers for the CI
# server-side dry-run. A laptop running the full stack needs the capacity for
# the nine services plus five datastores, so the local profile uses one node.
#
# kindnet does not enforce NetworkPolicy; the policies are declarative here.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: talent-ai-local
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
