apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 11 observability assets, unchanged. This kustomization exists only to
# give the two files their namespace now that the global `namespace: talent-ai`
# transformer has been removed from the entrypoints.
namespace: talent-ai

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: talent-ai
    includeSelectors: false

resources:
  - prometheus.yaml
  - grafana.yaml
