apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Legacy entrypoint preserved:
#
#   kubectl apply -k infrastructure/k8s
#
# Renders the production platform overlay (workloads + platform policy).
# Observability is not included here; use `kubectl apply -k infrastructure`
# for the combined stack.
#
# NOTE: production images are digest placeholders until the release workflow
# writes real digests. See docs/phase-12-kubernetes-platform.md.

resources:
  - overlays/production
