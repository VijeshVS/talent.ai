apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Legacy entrypoint preserved:
#
#   kubectl apply -k infrastructure
#
# Renders the production platform overlay plus the Phase 11 observability stack
# and the generated dashboard/rule ConfigMaps. The global `namespace:` and
# `images:` transformers were removed in Phase 12: namespaces are explicit per
# object, and image references are owned by the overlays.
#
# NOTE: production images are digest placeholders until the release workflow
# writes real digests. Use k8s/overlays/dev for a deployable local render.

resources:
  - k8s/overlays/production
  - k8s/observability

configMapGenerator:
  - name: talent-ai-grafana-dashboards
    files:
      - docker/grafana/dashboards/talent-platform-overview.json
      - docker/grafana/dashboards/talent-service-health.json
      - docker/grafana/dashboards/talent-conversion-funnels.json
      - docker/grafana/dashboards/talent-ai-talentlens.json
      - docker/grafana/dashboards/talent-events-rabbitmq.json
      - docker/grafana/dashboards/talent-rewards-notifications-analytics.json
    options:
      disableNameSuffixHash: true
  - name: talent-ai-prometheus-rules
    files:
      - docker/prometheus/rules/talent-ai.yml
    options:
      disableNameSuffixHash: true

# The generators above produce namespace-less ConfigMaps. Set the namespace
# explicitly instead of reintroducing a global transformer that would override
# the platform/data namespaces.
patches:
  - target:
      kind: ConfigMap
      name: talent-ai-grafana-dashboards
    patch: |-
      - op: add
        path: /metadata/namespace
        value: talent-ai
  - target:
      kind: ConfigMap
      name: talent-ai-prometheus-rules
    patch: |-
      - op: add
        path: /metadata/namespace
        value: talent-ai
